name: NBA prognozes

# Rīgas laikā: LIKMES ~21:30 · REZULTĀTI ~07:00 (+07:17) · WhatsApp ~07:30 · REZULTĀTI vēlreiz ~08:30.
# Laiki ir nedaudz pirms nominālā un ne uz pilnu/pusstundu, jo GitHub tad kavē visvairāk (līdz ~1 h).
# GitHub cron ir UTC un nezina vasaras laiku, tāpēc katrs laiks ir ieplānots divreiz (UTC+3 / UTC+2);
# scheduler.py palaiž tikai to, kas tajā dienā atbilst Rīgas laikam.
# GitHub ieplānotie darbi mēdz sākties ar 5-20 min nokavēšanos.
on:
  schedule:
    # Rīgas laiks ziemā = UTC+2, vasarā = UTC+3; scheduler.py izvēlas pareizo pēc datuma.
    - cron: "17 19 * * *"  # 21:17 ziemā  -> LIKMES
    - cron: "17 18 * * *"  # 21:17 vasarā -> LIKMES
    - cron: "47 4 * * *"   # 06:47 ziemā  -> REZULTĀTI
    - cron: "47 3 * * *"   # 06:47 vasarā -> REZULTĀTI
    - cron: "17 5 * * *"   # 07:17 ziemā / 08:17 vasarā -> REZULTĀTI
    - cron: "17 4 * * *"   # 07:17 vasarā -> REZULTĀTI
    - cron: "33 5 * * *"   # 07:33 ziemā  -> WhatsApp
    - cron: "33 4 * * *"   # 07:33 vasarā -> WhatsApp
    - cron: "17 6 * * *"   # 08:17 ziemā  -> REZULTĀTI
  workflow_dispatch:
    inputs:
      komanda:
        description: "Ko palaist"
        type: choice
        options: [likmes, rezultati, lapa, whatsapp]
        default: likmes

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nba-prognozes
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      komanda: ${{ steps.cmd.outputs.komanda }}
    steps:
      - uses: actions/checkout@v4
      - name: Izlemt, ko palaist
        id: cmd
        run: python3 scheduler.py "${{ github.event.schedule }}" "${{ inputs.komanda }}" >> "$GITHUB_OUTPUT"

  run:
    needs: decide
    if: needs.decide.outputs.komanda == 'likmes' || needs.decide.outputs.komanda == 'rezultati'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KOMANDA: ${{ needs.decide.outputs.komanda }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ESPN datu kešs
        uses: actions/cache@v4
        with:
          path: cache
          key: espn-cache-${{ github.run_id }}
          restore-keys: espn-cache-

      - name: Instalēt
        run: pip install -r requirements.txt

      - name: Palaist robotus (${{ env.KOMANDA }})
        run: |
          rc=0
          echo "::group::NBA"; python bot.py "$KOMANDA" --refresh || rc=1; echo "::endgroup::"
          echo "::group::NHL"; python nhl_bot.py "$KOMANDA" --refresh || rc=1; echo "::endgroup::"
          exit $rc

      - name: Saglabāt vēsturi
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history export odds predictions PROGNOZES.md nhl NHL.md
          if git diff --cached --quiet; then
            echo "Nav izmaiņu."
            exit 0
          fi
          git commit -m "$KOMANDA $(TZ=Europe/Riga date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1

  # Publiska lapa: https://<lietotājs>.github.io/nba-prognozes/
  # (vajag: repozitorijs Public, Settings -> Pages -> Source: GitHub Actions)
  pages:
    needs: [decide, run]
    if: always() && needs.decide.outputs.komanda != '' && needs.decide.outputs.komanda != 'whatsapp' && needs.run.result != 'failure'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Uzbūvēt lapu
        run: python site.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  # WhatsApp ziņa ar statistiku (vajag noslēpumus WHATSAPP_PHONE un WHATSAPP_APIKEY, sk. whatsapp.py)
  whatsapp:
    needs: decide
    if: needs.decide.outputs.komanda == 'whatsapp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Sūtīt WhatsApp
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
        run: python whatsapp.py
