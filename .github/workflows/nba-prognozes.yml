name: NBA prognozes

# LIKMES katru vakaru 21:30 un REZULTĀTI katru rītu 08:30 pēc Rīgas laika.
# GitHub cron ir UTC un nezina vasaras laiku, tāpēc katrs darbs ir ieplānots divreiz;
# scheduler.py palaiž tikai to, kas tajā dienā atbilst Rīgas laikam.
# GitHub ieplānotie darbi mēdz sākties ar 5-20 min nokavēšanos.
on:
  schedule:
    - cron: "30 18 * * *"  # 21:30 Rīgā vasarā (UTC+3)
    - cron: "30 19 * * *"  # 21:30 Rīgā ziemā (UTC+2)
    - cron: "30 5 * * *"   # 08:30 Rīgā vasarā
    - cron: "30 6 * * *"   # 08:30 Rīgā ziemā
  workflow_dispatch:
    inputs:
      komanda:
        description: "Ko palaist"
        type: choice
        options: [likmes, rezultati, lapa]
        default: likmes

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nba-prognozes
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      komanda: ${{ steps.cmd.outputs.komanda }}
    steps:
      - uses: actions/checkout@v4
      - name: Izlemt, ko palaist
        id: cmd
        run: python3 scheduler.py "${{ github.event.schedule }}" "${{ inputs.komanda }}" >> "$GITHUB_OUTPUT"

  run:
    needs: decide
    if: needs.decide.outputs.komanda == 'likmes' || needs.decide.outputs.komanda == 'rezultati'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KOMANDA: ${{ needs.decide.outputs.komanda }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ESPN datu kešs
        uses: actions/cache@v4
        with:
          path: cache
          key: espn-cache-${{ github.run_id }}
          restore-keys: espn-cache-

      - name: Instalēt
        run: pip install -r requirements.txt

      - name: Palaist robotu (${{ env.KOMANDA }})
        run: python bot.py "$KOMANDA" --refresh

      - name: Saglabāt vēsturi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history export odds predictions PROGNOZES.md
          if git diff --cached --quiet; then
            echo "Nav izmaiņu."
            exit 0
          fi
          git commit -m "$KOMANDA $(TZ=Europe/Riga date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1

  # Publiska lapa: https://<lietotājs>.github.io/nba-prognozes/
  # (vajag: repozitorijs Public, Settings -> Pages -> Source: GitHub Actions)
  pages:
    needs: [decide, run]
    if: always() && needs.decide.outputs.komanda != '' && needs.run.result != 'failure'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Uzbūvēt lapu
        run: python site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
