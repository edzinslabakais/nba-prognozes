name: NBA prognozes

# LIKMES katru vakaru 21:30 un REZULTĀTI katru rītu 08:30 pēc Rīgas laika.
# GitHub cron ir UTC un nezina vasaras laiku, tāpēc katrs darbs ir ieplānots divreiz;
# scheduler.py palaiž tikai to, kas tajā dienā atbilst Rīgas laikam.
# GitHub ieplānotie darbi mēdz sākties ar 5-20 min nokavēšanos.
on:
  schedule:
    - cron: "30 18 * * *"  # 21:30 Rīgā vasarā (UTC+3)
    - cron: "30 19 * * *"  # 21:30 Rīgā ziemā (UTC+2)
    - cron: "30 5 * * *"   # 08:30 Rīgā vasarā
    - cron: "30 6 * * *"   # 08:30 Rīgā ziemā
  workflow_dispatch:
    inputs:
      komanda:
        description: "Ko palaist"
        type: choice
        options: [likmes, rezultati]
        default: likmes

permissions:
  contents: write

concurrency:
  group: nba-prognozes
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Izlemt, ko palaist
        id: cmd
        run: python3 scheduler.py "${{ github.event.schedule }}" "${{ inputs.komanda }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.cmd.outputs.komanda != ''
        with:
          python-version: "3.12"
          cache: pip

      - name: ESPN datu kešs
        if: steps.cmd.outputs.komanda != ''
        uses: actions/cache@v4
        with:
          path: cache
          key: espn-cache-${{ github.run_id }}
          restore-keys: espn-cache-

      - name: Instalēt
        if: steps.cmd.outputs.komanda != ''
        run: pip install -r requirements.txt

      - name: Palaist robotu (${{ steps.cmd.outputs.komanda }})
        if: steps.cmd.outputs.komanda != ''
        run: python bot.py ${{ steps.cmd.outputs.komanda }} --refresh

      - name: Telegram ziņa
        if: steps.cmd.outputs.komanda != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify.py

      - name: Saglabāt vēsturi
        if: steps.cmd.outputs.komanda != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history export odds predictions PROGNOZES.md
          if git diff --cached --quiet; then
            echo "Nav izmaiņu."
            exit 0
          fi
          git commit -m "${{ steps.cmd.outputs.komanda }} $(TZ=Europe/Riga date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
